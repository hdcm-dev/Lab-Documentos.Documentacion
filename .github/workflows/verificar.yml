# Verificar: control de los PR de documentación de Lab-Documentos.Documentacion. Da a la guarda de merge
# (Conformacion-Pull-Request-Automatico, G3) corridas que leer.
#
# Jobs:
#   verificar   lo que el PR agrega: sin claves privadas ni artefactos binarios pesados.
#   docs-guard  llama al workflow reutilizable de Lab-Documentos, fijado por SHA del main vigente de Lab-Documentos
#               (grupos PR-1 a PR-7 y autoprueba; expediente 0002, unidades E1-U0b y U11-H-A de la vuelta de E1).
#               Una corrida por «ruta»: .github y la carpeta del expediente 0002 (DEF-05, DEF-17).
#
# Disparadores: pull_request, push a main (la corrida sobre el commit de merge queda en main; DEF-06) y
# workflow_dispatch.
#
# Seguridad: permissions contents: read; sin pull_request_target; actions y workflow llamado fijados por SHA;
# un PR desde un fork no corre en el runner propio (guarda «if:»); ningún secreto.
# Documentación: .github/README.md
name: Verificar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, i7infra-dev]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sin claves privadas ni binarios pesados en lo que agrega el PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          if [ -n "$BASE_SHA" ]; then RANGO="$BASE_SHA...$HEAD_SHA"; else RANGO="HEAD~1...HEAD"; fi
          FALLA=0
          if git diff "$RANGO" | grep -E '^\+' | grep -qE 'BEGIN ([A-Z]+ )?PRIVATE KEY'; then
            echo "::error::El PR agrega una clave privada."; FALLA=1
          fi
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in *.apk|*.aab|*.keystore|*.jks|*.p12) echo "::error::Artefacto no versionable: $f"; FALLA=1;; esac
            t=$(stat -c %s "$f")
            if [ "$t" -gt 5242880 ]; then echo "::error::Archivo de más de 5 MiB: $f ($t bytes)"; FALLA=1; fi
          done < <(git diff --name-only --diff-filter=AM "$RANGO")
          [ "$FALLA" -eq 0 ] && echo "Verificar: en orden."
          exit "$FALLA"

  docs-guard:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        ruta:
          - .github
          - PROMPTs/DEVs/Enchacement/01-Replanteo-Y-Analisis/OUTPUTs/Expedientes/0002-Replanteo-Metodologia-DocAsCode
    # main de Lab-Documentos al 2026-10-28 (merge del PR #30). Subir el pin es clase H.
    uses: hdcm-dev/Lab-Documentos/.github/workflows/docs-guard.yml@d65d52be2e236af4e858e2492c796845c21831d3
    with:
      ruta: ${{ matrix.ruta }}
      herramientas-ref: d65d52be2e236af4e858e2492c796845c21831d3
