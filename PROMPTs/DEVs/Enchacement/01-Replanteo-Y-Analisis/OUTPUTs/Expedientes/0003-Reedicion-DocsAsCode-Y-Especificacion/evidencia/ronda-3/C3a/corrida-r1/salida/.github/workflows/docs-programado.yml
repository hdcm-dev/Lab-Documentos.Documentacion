# Carril programado de Colmenar (A-10). Sólo avisa, con un issue. Propuesta sujeta a D-09 (runner).
# Qué vigila: frescura de 90 días de los procedimientos y 365 del resto; la copia de la tabla de productos
# veterinarios autorizados frente a la publicada (diario de octubre a marzo, mensual de abril a septiembre); la versión
# exacta del paquete del modelo de datos y la versión publicada de la API que consume la app.
name: docs-programado
on:
  schedule:
    - cron: "0 9 * 10-12,1-3 *"   # temporada de cosecha: todos los días
    - cron: "0 9 1 4-9 *"         # fuera de temporada: una vez al mes
  workflow_dispatch:
jobs:
  vigia:
    runs-on: [self-hosted, linux]   # {etiqueta-runner}: pendiente
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4   # fijar por SHA: pendiente
      - run: python3 .docs-guard/tools/docs-guard/dg.py frescura --dias 90 docs/_gobierno || true
      - run: python3 .docs-guard/tools/docs-guard/dg.py frescura --dias 365 docs || true
      - run: echo "comparación de la tabla de productos autorizados: pendiente (fuente y ruta sin definir)"
      # Con hallazgos, abrir un issue; nunca bloquea.
